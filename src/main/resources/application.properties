spring.application.name=skattepus

# Hemmelegheiter (client-id, KEYID, evt. passord) ligg i secret.yml — ikkje i git.
# optional:-prefiks gjer at appen startar sjolv om fila manglar (t.d. CI).
spring.config.import=optional:file:./src/main/resources/keys/secret.yml

# --- Maskinporten (testmiljo) ---
# Samme oppsett som anlegg-common-svarut (no.ks.fiks:maskinporten-client).
# SECRET-FILA (keys/secret.yml, ikkje i git) eig alle hemmelegheiter:
#   skattepus.maskinporten.client-id / key-id / scope  (+ evt. passord)
# Utan secret.yml manglar desse verdiene og /maskinporten/token vil feile.
# Miljovariablar og -D-flagg overstyrer uansett.
skattepus.maskinporten.private-key-file=src/main/resources/keys/maskinporten-test-private.pem
skattepus.maskinporten.audience=https://test.maskinporten.no/
skattepus.maskinporten.token-endpoint=https://test.maskinporten.no/token

# --- Skatteetaten DELING-api (test i motparten sitt testmiljo, .skatteetaten-test.no) ---
# Rettighetspakke (f.eks. frivillighetstotte) er ein {placeholder} i stien og blir
# sendt som parameter av brukar. Scope per API fra Skatteetaten sin API-dokumentasjon.
skattepus.skatteetaten.apis.aksjebeholdning.scope=skatteetaten:aksjebeholdning
skattepus.skatteetaten.apis.aksjebeholdning.base-url=https://aksjebeholdning.api.skatteetaten-test.no/v1
skattepus.skatteetaten.apis.aksjebeholdning.path-template=/person/{rettighetspakke}/{kalenderaar}/{ident}
skattepus.skatteetaten.apis.aksjonaer.scope=skatteetaten:aksjonaer
skattepus.skatteetaten.apis.aksjonaer.base-url=https://aksjonaerivirksomhet.api.skatteetaten-test.no/v1
skattepus.skatteetaten.apis.aksjonaer.path-template=/{rettighetspakke}/aksjonaerer/{organisasjonsnummer}
skattepus.skatteetaten.apis.naeringsspesifikasjon.scope=skatteetaten:naeringsspesifikasjon
skattepus.skatteetaten.apis.naeringsspesifikasjon.base-url=https://naeringsspesifikasjon.api.skatteetaten-test.no/v5
skattepus.skatteetaten.apis.naeringsspesifikasjon.path-template=/{rettighetspakke}/{inntektsaar}/{ident}
# MVA-fastsetting: fastsett merverdiavgift per orgnr over ein periode. Perioden
# (fraOgMed/tilOgMed) blir sendt som query-parameter. Viss Maskinporten svarar
# MP-250, manglar tildeling av scope skatteetaten:mvafastsetting for klienten.
skattepus.skatteetaten.apis.mvafastsetting.scope=skatteetaten:mvafastsetting
skattepus.skatteetaten.apis.mvafastsetting.base-url=https://mvafastsetting.api.skatteetaten-test.no/v1
skattepus.skatteetaten.apis.mvafastsetting.path-template=/{rettighetspakke}/fastsettinger/{organisasjonsnummer}

